<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finca de café Moreno</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='19' r='10' fill='%23A81F37'/%3E%3Cpath d='M16 9c0-4 3-6 8-6 0 5-3 7-8 6z' fill='%231E3B2B'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/estilos.css">
</head>
<body>

  <!-- Entrada -->
  <main id="entrada" class="entrada" hidden>
    <form id="formEntrada" class="entrada-caja" autocomplete="on">
      <svg class="marca-grande" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="19" r="10" fill="#A81F37"/><path d="M16 9c0-4 3-6 8-6 0 5-3 7-8 6z" fill="#E8A317"/></svg>
      <h1>Finca de café Moreno</h1>
      <p class="entrada-texto">Entra para llevar la cosecha, la planilla y las ventas.</p>
      <label>Usuario
        <input name="usuario" required
         autocomplete="username" autofocus>
      </label>
      <label>Contraseña
        <input name="password" type="password" required autocomplete="current-password">
      </label>
      <p id="errorEntrada" class="error" role="alert" hidden></p>
      <button class="boton primario" type="submit">Entrar</button>
    </form>
  </main>

  <!-- Aplicación -->
  <div id="app" class="app" hidden>
    <aside class="riel">
      <div class="marca">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="19" r="10" fill="#A81F37"/><path d="M16 9c0-4 3-6 8-6 0 5-3 7-8 6z" fill="#E8A317"/></svg>
        <span>Finca de café</span>
      </div>
      <nav id="menu" aria-label="Secciones"></nav>
      <div class="sesion">
        <span id="nombreUsuario"></span>
        <button id="btnSalir" class="enlace" type="button">Salir</button>
      </div>
    </aside>

    <main class="contenido">
      <header class="encabezado">
        <h1 id="titulo"></h1>
        <div id="acciones" class="acciones"></div>
      </header>
      <section id="vista" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="dialogo"></dialog>
  <div id="avisos" class="avisos" aria-live="polite"></div>

  <script src="/static/app.js"></script>
</body>
</html>
